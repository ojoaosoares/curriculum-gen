[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "curriculum-gen"
version = "0.1.0"
description = "AI-powered, 1-page ATS-optimized CV/Resume generator with Google XYZ formula, GitHub & academic ingestors, and job matching engine."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "João Soares" }
]
dependencies = [
    "jinja2>=3.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "requests>=2.28.0",
    "httpx>=0.25.0",
    "pypdf>=3.17.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0"
]

[project.scripts]
curriculum-gen = "curriculum_gen.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["curriculum_gen*"]
